name: CI/CD — Build, Push & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: Backend — build & push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/cinema-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          dockerfile: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=cinema-backend
          cache-to: type=gha,mode=max,scope=cinema-backend
      - name: Report backend image digest
        if: github.event_name == 'push'
        run: echo "Backend pushed — digest ${{ steps.meta-backend.outputs.digest }}"

  build-frontend:
    name: Frontend — build & push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/cinema-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          dockerfile: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            REACT_APP_GOOGLE_CLIENT_ID=${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
            REACT_APP_FACEBOOK_APP_ID=${{ secrets.REACT_APP_FACEBOOK_APP_ID }}
          cache-from: type=gha,scope=cinema-frontend
          cache-to: type=gha,mode=max,scope=cinema-frontend
      - name: Report frontend image digest
        if: github.event_name == 'push'
        run: echo "Frontend pushed — digest ${{ steps.meta-frontend.outputs.digest }}"

  update-manifests:
    name: CD — update image tags
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
      - name: Pin backend image tag in k8s manifest
        run: |
          sed -i \
            "s|image: .*/cinema-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/cinema-backend:sha-${{ steps.sha.outputs.short }}|g" \
            k8s/backend-deployment.yml
      - name: Pin frontend image tag in k8s manifest
        run: |
          sed -i \
            "s|image: .*/cinema-frontend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/cinema-frontend:sha-${{ steps.sha.outputs.short }}|g" \
            k8s/frontend-deployment.yml
      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend-deployment.yml k8s/frontend-deployment.yml
          git diff --staged --quiet && echo "No manifest changes." && exit 0
          git commit -m "ci: pin images to sha-${{ steps.sha.outputs.short }} [skip ci]"
          git push
